[project]
name = "identity-reference-poc-backend"
version = "0.1.0"
description = "Django authentication reference POC, bootstrap only"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django==5.2.19",
  "django-allauth[headless]==65.22.1",
  "djangorestframework==3.18.3",
]

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
  "pytest-django>=4.11,<5",
  "ruff>=0.14,<0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
