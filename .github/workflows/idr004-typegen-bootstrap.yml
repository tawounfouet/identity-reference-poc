name: IDR-004 One-time Typegen Bootstrap

# Temporary contents:write. Remove after committing lockfile and generated types.
on:
  push:
    branches: [feat/idr-004-typed-client]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idr004-typegen-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/feat/idr-004-typed-client'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.28.12"
          run_install: false
      - name: Generate lockfile for typegen and test tooling
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Install frozen frontend dependency graph
        run: pnpm install --frozen-lockfile
      - name: Generate browser-only OpenAPI TypeScript contracts
        run: pnpm types:generate
      - name: Run auth state and transport unit tests
        run: pnpm test
      - name: TypeScript static validation
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Persist generated artifacts to ticket branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/pnpm-lock.yaml frontend/src/features/auth/api/generated/allauth.d.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(idr-004): lock OpenAPI generator and commit generated browser types"
            git push origin HEAD:feat/idr-004-typed-client
          fi
