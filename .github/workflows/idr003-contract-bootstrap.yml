name: IDR-003 One-time Contract Bootstrap

# Temporary write workflow. Remove immediately after lockfile and real spec
# are committed and validated. Never enable on main.
on:
  push:
    branches:
      - feat/idr-003-allauth-headless
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idr003-contract-bootstrap
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/feat/idr-003-allauth-headless'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Resolve and lock the headless-spec extra
        run: uv lock
      - name: Install frozen dependencies
        run: uv sync --locked --group dev
      - name: Verify the Django configuration
        run: uv run --locked python manage.py check --settings=config.settings.spec
      - name: Export actual django-allauth OpenAPI from installed backend
        run: uv run --locked python tools/export_headless_openapi.py
      - name: Check Django migrations unchanged
        run: uv run --locked python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Apply new schema to a disposable database
        run: uv run --locked python manage.py migrate --noinput --settings=config.settings.test
      - name: Execute backend contracts
        run: uv run --locked pytest
      - name: Check imports and lint
        run: uv run --locked ruff check .
      - name: Commit generated lockfile and real OpenAPI
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock docs/api/allauth-browser-openapi.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(idr-003): lock spec extra and snapshot actual allauth OpenAPI"
            git push origin HEAD:feat/idr-003-allauth-headless
          fi
