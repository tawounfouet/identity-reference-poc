name: IDR-001 Generate lockfiles

# One-time bootstrap. This workflow only writes dependency locks on the
# dedicated ticket branch, never on main.
on:
  push:
    branches:
      - chore/idr-001-bootstrap
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idr-001-lockfiles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/chore/idr-001-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.28.12"
          run_install: false
      - name: Resolve Python dependency graph
        working-directory: backend
        run: uv lock
      - name: Resolve frontend dependency graph
        working-directory: frontend
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Frozen Python installation
        working-directory: backend
        run: uv sync --locked --group dev
      - name: Django check (no migrations)
        working-directory: backend
        run: uv run --locked python manage.py check --settings=config.settings.test
      - name: Python tests
        working-directory: backend
        run: uv run --locked pytest
      - name: Python lint
        working-directory: backend
        run: uv run --locked ruff check .
      - name: Frozen Next.js installation
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Next.js build
        working-directory: frontend
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock frontend/pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(idr-001): lock backend and frontend dependencies"
            git push origin HEAD:chore/idr-001-bootstrap
          else
            echo "Lockfiles already in sync"
          fi
