name: G0 Security Evidence (one-time)

# Read-only, temporary workflow. Remove before final merge.
on:
  push:
    branches: [audit/g0-final-acceptance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-advisories:
    name: Python locked-dependency advisory check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Export pinned Python requirements
        working-directory: backend
        run: uv export --locked --all-groups --format requirements-txt --no-hashes -o /tmp/g0-python-requirements.txt
      - name: Check Python advisories against resolved requirements
        working-directory: backend
        run: |
          uvx --from pip-audit pip-audit \
            --disable-pip --no-deps \
            --requirement /tmp/g0-python-requirements.txt \
            --format json --output /tmp/g0-python-audit.json
          echo "Python dependency advisory scan completed." >> "$GITHUB_STEP_SUMMARY"

  javascript-advisories:
    name: Node locked-dependency advisory check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.28.12"
          run_install: false
      - name: Audit locked Node dependency graph
        run: pnpm audit --audit-level high
