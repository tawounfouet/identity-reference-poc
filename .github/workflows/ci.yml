name: Identity Reference CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idr-001-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python / Django
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Verify lockfile is committed
        run: test -f uv.lock
      - name: Frozen Python installation
        run: uv sync --locked --group dev
      - name: Verify migration files match Django models
        run: uv run --locked python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Apply initial migrations to a disposable CI database
        run: uv run --locked python manage.py migrate --noinput --settings=config.settings.test
      - name: Django system checks
        run: uv run --locked python manage.py check --settings=config.settings.test
      - name: Bootstrap smoke test
        run: uv run --locked pytest
      - name: Python style and imports
        run: uv run --locked ruff check .

  frontend:
    name: TypeScript / Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.28.12"
          run_install: false
      - name: Verify lockfile is committed
        run: test -f pnpm-lock.yaml
      - name: Frozen frontend installation
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
